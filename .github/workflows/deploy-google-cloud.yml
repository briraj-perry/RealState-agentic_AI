name: Deploy Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'estate-ai' }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'estate-ai' }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || 'https://ollama.com' }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gemma4:31b' }}
      WHATSAPP_MODE: ${{ vars.WHATSAPP_MODE || 'simulate' }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_GRAPH_VERSION: ${{ vars.WHATSAPP_GRAPH_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        shell: bash
        run: |
          for key in GCP_PROJECT_ID RUNTIME_SERVICE_ACCOUNT WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT; do
            if [ -z "${!key}" ]; then
              echo "::error::Set production environment variable $key. See docs/GOOGLE_CLOUD_DEPLOYMENT.md."
              exit 1
            fi
          done
          if [ "$WHATSAPP_MODE" = live ] && { [ -z "$WHATSAPP_PHONE_NUMBER_ID" ] || [ -z "$WHATSAPP_GRAPH_VERSION" ]; }; then
            echo '::error::Live mode requires WHATSAPP_PHONE_NUMBER_ID and WHATSAPP_GRAPH_VERSION.'
            exit 1
          fi
          echo "IMAGE=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$CLOUD_RUN_SERVICE:$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Write runtime configuration privately
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ vars.MONGODB_DATABASE || 'estate_ai' }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          required = ['MONGODB_URI', 'ADMIN_API_KEY', 'OLLAMA_API_KEY']
          if os.environ['WHATSAPP_MODE'] == 'live':
              required += ['WHATSAPP_ACCESS_TOKEN', 'WHATSAPP_APP_SECRET', 'WHATSAPP_VERIFY_TOKEN']
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing GitHub production secrets: ' + ', '.join(missing))
          keys = ['MONGODB_URI', 'MONGODB_DATABASE', 'ADMIN_API_KEY', 'OLLAMA_BASE_URL', 'OLLAMA_MODEL',
                  'OLLAMA_API_KEY', 'WHATSAPP_MODE', 'WHATSAPP_PHONE_NUMBER_ID', 'WHATSAPP_GRAPH_VERSION',
                  'WHATSAPP_ACCESS_TOKEN', 'WHATSAPP_APP_SECRET', 'WHATSAPP_VERIFY_TOKEN']
          config = {key: os.environ.get(key, '') for key in keys}
          config.update(WORKER_ENABLED='true', ALLOW_DEMO_DATA='false')
          path = Path(os.environ['RUNNER_TEMP']) / 'estate-runtime.json'
          path.write_text(json.dumps(config))
          path.chmod(0o600)
          PY
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push revision image
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy minimal app container
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --image="$IMAGE" --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --env-vars-file="$RUNNER_TEMP/estate-runtime.json" \
            --allow-unauthenticated --execution-environment=gen2 --no-cpu-throttling \
            --min=1 --max=1 --max-instances=1 --cpu=1 --memory=512Mi --concurrency=2 --timeout=300 --quiet
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" --format='value(status.url)')"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
      - name: Remove temporary runtime configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/estate-runtime.json"
      - name: Check deployed health
        run: |
          curl --fail --retry 8 --retry-all-errors --retry-delay 5 "$SERVICE_URL/health"
          printf 'Dashboard: %s\nMeta callback: %s/webhooks/whatsapp\n' "$SERVICE_URL" "$SERVICE_URL" >> "$GITHUB_STEP_SUMMARY"
