name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Start disposable MongoDB replica set
        run: |
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker logs --tail 80 estate-mongo; docker inspect estate-mongo --format="{{json .State}}"; fi' EXIT
          docker run -d --name estate-mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec estate-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            if [ "$(docker inspect estate-mongo --format='{{.State.Running}}')" != true ]; then exit 1; fi
            sleep 2
          done
          docker exec estate-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          python -c 'import os; from pymongo import MongoClient; MongoClient(os.environ["TEST_MONGODB_URI"], serverSelectionTimeoutMS=30000).admin.command("ping")'
      - name: Lint and test
        run: |
          ruff check .
          ruff format --check .
          node --check estate_ai/web/app.js
          pytest -q
      - name: Build and smoke test container
        run: |
          docker build -t estate-ai:ci .
          docker run -d --name estate-ci --network host \
            -e MONGODB_URI="$TEST_MONGODB_URI" -e MONGODB_DATABASE=estate_smoke \
            -e WORKER_ENABLED=false -e WHATSAPP_MODE=simulate estate-ai:ci
          trap 'docker logs estate-ci; docker rm -f estate-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health; then
              curl --fail --silent http://localhost:8080/ > /dev/null
              exit 0
            fi
            sleep 2
          done
          exit 1
