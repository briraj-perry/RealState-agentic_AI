name: Check Cloud Run availability

on: workflow_dispatch

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'estate-ai' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read service conditions
        run: |
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" \
            --format='yaml(status.conditions,status.latestReadyRevisionName,status.traffic)'
      - name: Read scaling and instance counts
        run: |
          python - <<'PYTHON'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          project, region, service = (os.environ[k] for k in ("PROJECT", "REGION", "SERVICE"))
          token = subprocess.check_output(["gcloud", "auth", "print-access-token"], text=True).strip()

          def read(url, params):
              request = urllib.request.Request(url + "?" + urllib.parse.urlencode(params),
                                               headers={"Authorization": "Bearer " + token})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          url = f"https://run.googleapis.com/v2/projects/{project}/locations/{region}/services/{service}"
          print(read(url, {"fields": "scaling,template/scaling,ingress,defaultUriDisabled,invokerIamDisabled,urls"}))
          now = datetime.now(timezone.utc)
          try:
              data = read(f"https://monitoring.googleapis.com/v3/projects/{project}/timeSeries", {
                  "filter": f'metric.type="run.googleapis.com/container/instance_count" AND resource.labels.service_name="{service}" AND resource.labels.location="{region}"',
                  "interval.startTime": (now - timedelta(minutes=30)).isoformat(),
                  "interval.endTime": now.isoformat(),
              })
          except urllib.error.HTTPError as exc:
              print("Instance count unavailable, HTTP", exc.code)
          else:
              series = data.get("timeSeries", [])
              if not series:
                  print("No instance-count samples in the last 30 minutes")
              for entry in series:
                  print(entry["resource"]["labels"]["revision_name"], entry["metric"]["labels"], entry["points"][:1])
          PYTHON
      - name: Check project billing link
        run: gcloud billing projects describe "$PROJECT" --format='value(billingEnabled)'
      - name: Read recent platform errors
        if: always()
        run: |
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=\"$SERVICE\" AND severity>=ERROR" \
            --project="$PROJECT" --freshness=3d --limit=10 --format='table(timestamp,severity,httpRequest.status,logName)'
