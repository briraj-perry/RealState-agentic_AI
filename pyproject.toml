[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "estate-ai"
version = "0.1.0"
description = "WhatsApp real estate assistant powered by Gemma 4 and controlled tools"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3",
  "httpx>=0.28,<1", "langgraph>=1.0,<2", "psycopg[binary]>=3.2,<4",
  "tzdata>=2025.1",
  "pillow>=11,<13",
  "openpyxl>=3.1,<4", "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["estate_ai*"]

[tool.setuptools.package-data]
estate_ai = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
