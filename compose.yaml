# Local development only. Port is bound to loopback, never public internet.
services:
  mongodb:
    image: mongo:8.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports: ['127.0.0.1:27017:27017']
    volumes: [estate_mongo:/data/db]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - 'try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({_id:"rs0", members:[{_id:0,host:"localhost:27017"}]}); quit(1) }'
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  estate_mongo:
